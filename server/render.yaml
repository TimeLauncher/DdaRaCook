services:
  - type: web
    name: cookassist-judge
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: VLM_BACKEND
        value: nemotron
      - key: DEBUG_MODE
        value: "true"
      - key: ROI_CROP_ENABLED
        value: "true"
      - key: NVIDIA_API_KEY
        sync: false      # 대시보드에서 직접 입력 (저장소에 남기지 않음)
      - key: NVIDIA_BASE_URL
        sync: false
      - key: NVIDIA_MODEL
        sync: false
      - key: TEAM_TOKEN
        sync: false
      # Render의 데이터센터 IP는 YouTube 자막 직접 조회가 차단된다(HTTP 503).
      # 둘 중 하나는 반드시 대시보드에 넣어야 /extract-recipe 가 실제로 동작한다.
      - key: YOUTUBE_TRANSCRIPT_API_KEY
        sync: false
